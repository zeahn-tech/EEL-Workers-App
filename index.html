<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EEL Messenger | Elite Express Logistics Liberia</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Official real-time operational messaging platform for Elite Express Logistics Liberia (EEL)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EEL Messenger" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS for Location Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <!-- This MUST point at the real source entry — Vite reads this file as its build
         entry point and crawls the module graph starting here. Pointing this at a
         prebuilt dist/ file (as a previous version of this file did) makes Vite bundle
         that stale prebuilt file instead of the actual current source — silently, with
         no build error — which is why past builds kept shipping old code even after a
         successful, green CI run. -->
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('EEL PWA ServiceWorker registered with scope:', reg.scope);
              // If a new service worker takes control of an already-open tab (i.e. this
              // isn't the very first install), reload once so the page's already-loaded
              // JS/CSS is replaced with the fresh version instead of silently sitting
              // stale until the next manual hard-refresh.
              let hasReloaded = false;
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (hasReloaded) return;
                hasReloaded = true;
                window.location.reload();
              });
            })
            .catch(err => console.error('EEL PWA ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
